<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>불법옥외광고물 정비 최적화 경로 안내</title>
    <style>
        body { margin: 0; padding: 20px; font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #333; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 800px; }
        header { text-align: center; color: white; margin-bottom: 25px; }
        header h1 { font-size: 1.6rem; margin: 0 0 5px 0; }
        header p { font-size: 0.85rem; opacity: 0.9; margin: 0; }
        .summary-box { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border-radius: 15px; padding: 15px; color: white; text-align: center; margin-bottom: 25px; border: 1px solid rgba(255, 255, 255, 0.3); font-weight: bold; font-size: 0.9rem; }
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .card.start { background: linear-gradient(to right, #11998e, #38ef7d); color: white; }
        .card.end { background: linear-gradient(to right, #f83600, #f9d423); color: white; }
        .badge { display: inline-block; width: 32px; height: 32px; border-radius: 50%; text-align: center; line-height: 32px; font-weight: bold; margin-bottom: 12px; font-size: 0.9rem; }
        .badge.start { background: #2e7d32; color: white; }
        .badge.mid { background: #1976d2; color: white; }
        .badge.end { background: #e65100; color: white; }
        .card-title { font-size: 1.15rem; font-weight: bold; margin-bottom: 15px; word-break: keep-all; }
        .info-box { background: #f5f5f5; border-radius: 12px; padding: 15px; font-size: 0.9rem; margin-bottom: 15px; color: #444; line-height: 1.5; }
        .info-box div { margin-bottom: 6px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
        .info-box div:last-child { border: none; }
        .guide-text { font-size: 0.8rem; color: #666; margin-bottom: 15px; font-style: italic; }
        .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { text-decoration: none; text-align: center; padding: 12px; border-radius: 10px; color: white; font-weight: bold; font-size: 0.9rem; }
        .btn-tmap { background: linear-gradient(45deg, #8e2de2, #4a00e0); }
        .btn-naver { background: linear-gradient(45deg, #00c73c, #00bf18); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>불법옥외광고물 정비 최적화 경로 안내</h1>
            <p>의정부 지리를 고려하여 설계한 31개 지점 루프형 경로입니다.</p>
        </header>

        <div id="route-container">
            </div>

    </div>

    <script>
        const routeData = [
            { type: 'start', title: '의정부시청 (출발)', addr: '의정부시 시민로 1' },
            { type: 'mid', seq: 1, origin: 1, addr: '산곡동 692 (부동산)', work: '에어라이트 시정명령 확인', photo: '야간 부동산 에어라이트', lat: 37.7123, lng: 127.1045, guide: '산곡동 초입부터 정비를 시작합니다.' },
            { type: 'mid', seq: 2, origin: 2, addr: '산곡동 751', work: '광고 현수막 제거', photo: '펜스 부착 가로형 현수막', lat: 37.7145, lng: 127.1088, guide: '인접한 펜스 구역을 확인하세요.' },
            { type: 'mid', seq: 3, origin: 3, addr: '산곡동 754', work: '광고 현수막 제거', photo: '가드레일 부착 현수막', lat: 37.7150, lng: 127.1095, guide: '도로변 가드레일을 따라 이동합니다.' },
            { type: 'mid', seq: 4, origin: 4, addr: '산곡동 371-2', work: '광고 현수막 제거', photo: '교량 난간 부착 현수막', lat: 37.7162, lng: 127.1105, guide: '교량 부근 정차 시 주의하세요.' },
            { type: 'mid', seq: 5, origin: 5, addr: '고산동 540-4', work: '홍보 현수막 제거', photo: '법조타운 공사현장 펜스', lat: 37.7156, lng: 127.1123, guide: '대형 현수막 정비 구역입니다.' },
            { type: 'mid', seq: 6, origin: 6, addr: '산곡동 687', work: '에어라이트 계고', photo: '상가 앞 BAR 에어라이트', lat: 37.7135, lng: 127.1062, guide: '상가 밀집 지역입니다.' },
            { type: 'mid', seq: 7, origin: 7, addr: '산곡동 778', work: '광고 현수막 제거', photo: '빛가온문화공원 인근', lat: 37.7180, lng: 127.1150, guide: '공원 주변 도로를 점검합니다.' },
            { type: 'mid', seq: 8, origin: 8, addr: '주소미상 (장암동 인근)', work: '3.1절 현수막 제거', photo: '나무 사이 기념 현수막', lat: 37.7250, lng: 127.0550, guide: '장암동 진입 전 나무 사이를 확인하세요.' },
            { type: 'mid', seq: 9, origin: 9, addr: '평화로 324 (14:50 일정)', work: '한주프라자 방문', photo: '도시주택국장 방문 업무', lat: 37.7289, lng: 127.0467, guide: '시간 맞춰 시내권으로 진입합니다.' },
            { type: 'mid', seq: 10, origin: 10, addr: '가능동 642', work: '전신주 벽보 제거', photo: '예쁘게 헤어 앞 전신주', lat: 37.7485, lng: 127.0388, guide: '전신주 밀착 정비가 필요합니다.' },
            { type: 'mid', seq: 11, origin: 11, addr: '호원동 454', work: '현수막 노끈 제거', photo: '가로등 폐노끈', lat: 37.7212, lng: 127.0434, guide: '잔여 노끈을 깔끔히 정리합니다.' },
            { type: 'mid', seq: 12, origin: 12, addr: '의정부동 586-1', work: '불법현수막 제거', photo: '흰색 바탕 불법 현수막', lat: 37.7350, lng: 127.0450, guide: '시내 이면도로 구간입니다.' },
            { type: 'mid', seq: 13, origin: 13, addr: '둔야로49번길 49', work: '불법광고물 신고건', photo: '빽다방 앞 가드레일', lat: 37.7380, lng: 127.0410, guide: '유동인구 많은 상가 앞입니다.' },
            { type: 'mid', seq: 14, origin: 14, addr: '누원로 40', work: '시위 현수막 정비', photo: '코코유치원 앞 시위물', lat: 37.7023, lng: 127.0512, guide: '유치원 앞 안전에 유의하세요.' },
            { type: 'mid', seq: 15, origin: 15, addr: '의정부동 512-1', work: '불법 광고지 수거', photo: '보도 위 살포 전단지', lat: 37.7320, lng: 127.0480, guide: '바닥면 정비가 필요합니다.' },
            { type: 'mid', seq: 16, origin: 16, addr: '호암로 95', work: '우체국 인근 확인', photo: '주소지 정비 대상 확인', lat: 37.7200, lng: 127.0520, guide: '우체국 주변을 탐색합니다.' },
            { type: 'mid', seq: 17, origin: 17, addr: '장암동 20-19', work: '불법현수막 제거', photo: '발곡역 인근 펜스', lat: 37.7256, lng: 127.0567, guide: '경전철 역사를 따라 이동합니다.' },
            { type: 'mid', seq: 18, origin: 18, addr: '장암동 43-3', work: '불법현수막 제거', photo: '롯데마트 인근 코너', lat: 37.7240, lng: 127.0580, guide: '마트 이용 차량에 주의하세요.' },
            { type: 'mid', seq: 19, origin: 19, addr: '장암동 20', work: '불법 현수막 제거', photo: '장암주민센터 인근 대로', lat: 37.7265, lng: 127.0595, guide: '주민센터 앞 대로변 정비입니다.' },
            { type: 'mid', seq: 20, origin: 20, addr: '신곡동 148-2', work: '불법현수막 제거', photo: '금동초 인근 대로변', lat: 37.7315, lng: 127.0620, guide: '어린이 보호구역 유의하세요.' },
            { type: 'mid', seq: 21, origin: 21, addr: '장암동 20 (인근)', work: '불법 현수막 제거', photo: '19번 지점 연계 정비', lat: 37.7268, lng: 127.0598, guide: '누락 없이 연속 정비합니다.' },
            { type: 'mid', seq: 22, origin: 22, addr: '장암동 43-2', work: '불법 현수막(중복)', photo: '광명교회 앞 펜스', lat: 37.7235, lng: 127.0575, guide: '교회 앞 펜스 구간입니다.' },
            { type: 'mid', seq: 23, origin: 24, addr: '장암동 20-6', work: '불법현수막 제거', photo: '발곡중 인근 횡단보도', lat: 37.7275, lng: 127.0560, guide: '횡단보도 시야 방해물 제거입니다.' },
            { type: 'mid', seq: 24, origin: 25, addr: '신곡동 747-1', work: '불법현수막 제거', photo: '나은동물병원 앞 펜스', lat: 37.7305, lng: 127.0615, guide: '병원 앞 펜스 라인입니다.' },
            { type: 'mid', seq: 25, origin: 26, addr: '자일동 산 111-14', work: '삼거리 현수막 제거', photo: '삼거리 민원 요청지', lat: 37.7654, lng: 127.0876, guide: '자일동 삼거리 탁 트인 곳입니다.' },
            { type: 'mid', seq: 26, origin: 27, addr: '부용로 98-94 사이', work: '불법현수막 제거', photo: '도로 시설물 부착물', lat: 37.7450, lng: 127.0720, guide: '시설물 파손에 유의하세요.' },
            { type: 'mid', seq: 27, origin: 29, addr: '자일동 69-29', work: '고속도로 불법 현수막', photo: '자금지하차도 위', lat: 37.7580, lng: 127.0820, guide: '지하차도 상부 안전 확인하세요.' },
            { type: 'mid', seq: 28, origin: 30, addr: '신곡동 748-1 (촬영전용)', work: '정당 현수막 채증', photo: '제거 금지 대상', lat: 37.7412, lng: 127.0654, guide: '증빙용 사진만 촬영 후 이동합니다.' },
            { type: 'end', title: '의정부시청 (복귀)', addr: '의정부시 시민로 1' }
        ];

        const container = document.getElementById('route-container');
        
        routeData.forEach(p => {
            const card = document.createElement('div');
            card.className = p.type === 'mid' ? 'card' : `card ${p.type}`;
            
            if (p.type === 'start' || p.type === 'end') {
                card.innerHTML = `
                    <div class="badge ${p.type}">${p.type === 'start' ? '출발' : '복귀'}</div>
                    <div class="card-title">${p.title}</div>
                    <div class="info-box" style="background:rgba(0,0,0,0.05);">주소: ${p.addr}</div>
                `;
            } else {
                card.innerHTML = `
                    <div class="badge mid">${p.seq}</div>
                    <div class="card-title">${p.addr}</div>
                    <div class="info-box">
                        <div><strong>원래순번:</strong> ${p.origin}</div>
                        <div><strong>민원내용:</strong> ${p.work}</div>
                        <div><strong>현장사진:</strong> ${p.photo}</div>
                    </div>
                    <p class="guide-text">${p.guide}</p>
                    <div class="button-group">
                        <a href="tmap://route?goalname=${encodeURIComponent(p.addr)}&goaly=${p.lat}&goalx=${p.lng}" class="btn btn-tmap">티맵</a>
                        <a href="nmap://route/car?dlat=${p.lat}&dlng=${p.lng}&dname=${encodeURIComponent(p.addr)}&appname=com.nhn.android.nmap" class="btn btn-naver">네이버</a>
                    </div>
                `;
            }
            container.appendChild(card);
        });
    </script>
</body>
</html>
