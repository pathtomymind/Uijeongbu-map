<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>불법옥외광고물 정비 최적화 경로 안내</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; color: #333; }
        .container { max-width: 800px; width: 100%; }
        .header { text-align: center; color: white; margin-bottom: 15px; }
        .header h1 { font-size: 1.4rem; margin-bottom: 5px; }
        .header p { font-size: 0.75rem; opacity: 0.9; }
        .summary-box { background: rgba(255, 255, 255, 0.95); padding: 12px; border-radius: 15px; margin-bottom: 15px; text-align: center; font-weight: bold; font-size: 0.9rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card { background: white; border-radius: 20px; padding: 15px; margin-bottom: 15px; box-shadow: 0 8px 15px rgba(0,0,0,0.1); position: relative; border: 1px solid rgba(0,0,0,0.05); }
        .card.start { background: linear-gradient(to right, #11998e, #38ef7d); color: white; }
        .card.end { background: linear-gradient(to right, #f85032, #e73827); color: white; }
        .badge { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 8px; color: white; font-size: 0.85rem; }
        .badge.start { background-color: #1b5e20; }
        .badge.mid { background-color: #0d47a1; }
        .badge.end { background-color: #b71c1c; }
        .title { font-size: 0.95rem; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; }
        .info-box { background-color: #f8f9fa; padding: 10px; border-radius: 10px; font-size: 0.8rem; margin-bottom: 10px; color: #444; border: 1px solid #eee; }
        .info-item { margin-bottom: 3px; line-height: 1.4; }
        .guide { font-size: 0.7rem; color: #666; margin-bottom: 10px; line-height: 1.3; background: #fffbe6; padding: 5px; border-radius: 5px; }
        .btn-group { display: flex; gap: 8px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; color: white; font-weight: bold; text-align: center; text-decoration: none; cursor: pointer; font-size: 0.8rem; }
        .btn-tmap { background: linear-gradient(45deg, #a4508b, #5f0a87); }
        .btn-naver { background: linear-gradient(45deg, #03cf5d, #009f4b); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>불법옥외광고물 정비 최적화 경로 안내</h1>
            <p>34개 지점 전수를 분석하여 설계한 루프형 경로입니다.</p>
        </div>

        <div class="summary-box">
            오늘의 점검 경로 요약: 의정부시청 출발 → 총 34개 지점 → 의정부시청 복귀
        </div>

        <div class="card start">
            <div class="title"><span class="badge start">S</span> 출발: 의정부시청</div>
            <div style="font-size: 0.85rem;">경기도 의정부시 시민로 1</div>
        </div>

        <div id="route-cards"></div>

        <script>
            // 34개 지점 데이터 매핑
            const locations = [
                { id: 1, addr: "경의로 125", name: "의정부경찰서", lat: 37.7442, lng: 127.0443, content: "가로등 현수막", photo: "경찰서 입구 가로수", guide: "시청에서 의정부역 서부 이동" },
                { id: 2, addr: "의정부동 494", name: "서부역 다이소", lat: 37.7385, lng: 127.0436, content: "에어라이트", photo: "보도 위 무단 적치", guide: "경의로 따라 남하" },
                { id: 3, addr: "의정부동 516", name: "서부역 상가", lat: 37.7371, lng: 127.0415, content: "전단지/벽보", photo: "상가 벽면 부착물", guide: "인근 골목 정비" },
                { id: 4, addr: "가능동 704-5", name: "가능역 1번출구", lat: 37.7483, lng: 127.0442, content: "역사 주변 전단지", photo: "가로등 기둥 부착물", guide: "신흥로 따라 북상" },
                { id: 5, addr: "가능동 677-5", name: "한다빌딩 주변", lat: 37.7495, lng: 127.0428, content: "상가 홍보물", photo: "인도 배너 거치대", guide: "가능역 서부 방향" },
                { id: 6, addr: "가능동 631-21", name: "가능동 주민센터 인근", lat: 37.7512, lng: 127.0405, content: "벽보 제거", photo: "담장 부착물", guide: "주택가 이면도로 진입" },
                { id: 7, addr: "금오동 470-1", name: "홈플러스 금오점", lat: 37.7516, lng: 127.0694, content: "에어라이트 집중 정비", photo: "상가 앞 보도", guide: "호국로 이용 금오지구 이동" },
                { id: 8, addr: "금오동 473", name: "금오동 상업지구", lat: 37.7525, lng: 127.0705, content: "불법 배너", photo: "도로변 거치대", guide: "홈플러스 인접 구역" },
                { id: 9, addr: "금오동 476", name: "경기북부청사 앞", lat: 37.7541, lng: 127.0718, content: "현수막 정비", photo: "청사 주변 가로수", guide: "청사로 방향 이동" },
                { id: 10, addr: "신곡동 761-4", name: "동오마을 주차장", lat: 37.7434, lng: 127.0570, content: "펜스 부착물", photo: "공영주차장 울타리", guide: "부용천 건너 신곡동 진입" },
                { id: 11, addr: "신곡동 720-1", name: "신곡2동 주민센터", lat: 37.7415, lng: 127.0598, content: "벽보/전단지", photo: "게시판 외 무단 부착", guide: "동오마을 내 이동" },
                { id: 12, addr: "신곡동 674", name: "동오초등학교 인근", lat: 37.7445, lng: 127.0555, content: "스쿨존 광고물", photo: "학교 펜스", guide: "스쿨존 안전 점검" },
                { id: 13, addr: "장곡로 102", name: "가족지원센터", lat: 37.7335, lng: 127.0431, content: "울타리 벽보", photo: "센터 외곽 펜스", guide: "장곡로 따라 남하" },
                { id: 14, addr: "장암동 20-1", name: "장암주공아파트", lat: 37.7285, lng: 127.0520, content: "아파트 외벽 광고", photo: "단지 입구 상가", guide: "동일로 방향 이동" },
                { id: 15, addr: "동일로 156", name: "오리랑 주변", lat: 37.7268, lng: 127.0479, content: "입간판 점검", photo: "도로변 식당 간판", guide: "동일로 남측 이동" },
                { id: 16, addr: "동일로 149-1", name: "신한식물원", lat: 37.7095, lng: 127.0460, content: "가로수 현수막", photo: "식물원 입구 가로등", guide: "장암역 방향 직진" },
                { id: 17, addr: "호원동 454", name: "회룡역 인근", lat: 37.7144, lng: 127.0474, content: "인도 배너 정비", photo: "회룡역 상가 보도", guide: "평화로 이용 북상" },
                { id: 18, addr: "호원동 411", name: "호원1동 주민센터", lat: 37.7185, lng: 127.0465, content: "벽보 제거", photo: "주민센터 앞 전신주", guide: "평화로 동선 유지" },
                { id: 19, addr: "호원동 312", name: "망월사역 주변", lat: 37.7005, lng: 127.0415, content: "역사 광고물", photo: "교각 하부 부착물", guide: "남단 끝 지점 후 회행" },
                { id: 20, addr: "범골로 142", name: "상우고등학교", lat: 37.7325, lng: 127.0355, content: "학교 주변 전단지", photo: "담장 및 가로등", guide: "서부로/범골로 이용" },
                { id: 21, addr: "의정부동 442", name: "경의초등학교", lat: 37.7355, lng: 127.0425, content: "어린이보호구역", photo: "학교 횡단보도 주변", guide: "시내권 재진입" },
                { id: 22, addr: "의정부동 214", name: "중앙로 입구", lat: 37.7412, lng: 127.0485, content: "배너/에어라이트", photo: "행복로 상업지구", guide: "의정부역 동측 이동" },
                { id: 23, addr: "의정부동 172", name: "제일시장 주변", lat: 37.7425, lng: 127.0505, content: "무단 적치물", photo: "시장 입구 도로변", guide: "시장 통행로 정비" },
                { id: 24, addr: "태평로 73", name: "구터미널 인근", lat: 37.7455, lng: 127.0515, content: "벽보 집중 제거", photo: "노후 건물 벽면", guide: "태평로 따라 이동" },
                { id: 25, addr: "호국로 1310", name: "의정부중앙역", lat: 37.7465, lng: 127.0495, content: "경전철 교각", photo: "교각 기둥 광고물", guide: "경전철 라인 이동" },
                { id: 26, addr: "의정부동 138", name: "의정부 로데오", lat: 37.7401, lng: 127.0465, content: "홍보 전단지", photo: "바닥 및 벽면 부착", guide: "로데오거리 순찰" },
                { id: 27, addr: "용현동 2", name: "만가대 교차로", lat: 37.7355, lng: 127.0785, content: "대형 현수막", photo: "교차로 가로수", guide: "국도 43호선 방향" },
                { id: 28, addr: "민락동 805", name: "민락2지구 상가", lat: 37.7515, lng: 127.0915, content: "에어라이트 정비", photo: "중심상가 보도", guide: "민락지구 이동" },
                { id: 29, addr: "민락동 812", name: "코스트코 주변", lat: 37.7555, lng: 127.0945, content: "도로변 불법광고", photo: "갓길 무단 입간판", guide: "외곽 순환로 방향" },
                { id: 30, addr: "낙양동 720", name: "낙양동 주택단지", lat: 37.7625, lng: 127.0985, content: "벽보 제거", photo: "빌라촌 전신주", guide: "북측 외곽 이동" },
                { id: 31, addr: "자일동 200", name: "축석고개 인근", lat: 37.7755, lng: 127.0855, content: "현수막 제거", photo: "시계 경계 가로수", guide: "포천 경계 지점" },
                { id: 32, addr: "녹양동 320", name: "녹양역 광장", lat: 37.7585, lng: 127.0355, content: "역사 주변 정비", photo: "녹양역 출구 주변", guide: "호국로 이용 녹양동 이동" },
                { id: 33, addr: "녹양동 406", name: "의정부 종합운동장", lat: 37.7615, lng: 127.0315, content: "대형 홍보물", photo: "운동장 펜스", guide: "종합운동장 입구" },
                { id: 34, addr: "의정부동 516", name: "의정부역 서부(종료)", lat: 37.7371, lng: 127.0415, content: "최종 확인 정비", photo: "상가 밀집 구역", guide: "시청 복귀 전 마지막 점검" }
            ];

            const listContainer = document.getElementById('route-cards');
            locations.forEach((loc, idx) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="title"><span class="badge mid">${idx + 1}</span> ${loc.addr} (${loc.name})</div>
                    <div class="info-box">
                        <div class="info-item"><b>원래순번:</b> ${loc.id}</div>
                        <div class="info-item"><b>민원내용:</b> ${loc.content}</div>
                        <div class="info-item"><b>현장사진요약:</b> ${loc.photo}</div>
                    </div>
                    <div class="guide">이동 가이드: ${loc.guide}</div>
                    <div class="btn-group">
                        <a href="tmap://route?goalname=${encodeURIComponent(loc.addr + ' ' + loc.name)}&goaly=${loc.lat}&goalx=${loc.lng}" class="btn btn-tmap">티맵</a>
                        <a href="nmap://route/car?dlat=${loc.lat}&dlng=${loc.lng}&dname=${encodeURIComponent(loc.addr + ' ' + loc.name)}&appname=com.nhn.android.nmap" class="btn btn-naver">네이버</a>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        </script>

        <div class="card end">
            <div class="title"><span class="badge end">E</span> 복귀: 의정부시청</div>
            <div style="font-size: 0.85rem;">경기도 의정부시 시민로 1</div>
        </div>
    </div>
</body>
</html>
