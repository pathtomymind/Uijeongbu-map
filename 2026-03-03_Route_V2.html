<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>불법옥외광고물 정비 최적화 경로 안내</title>
    <style>
        body { margin: 0; padding: 20px; font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #333; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 800px; }
        header { text-align: center; color: white; margin-bottom: 25px; }
        header h1 { font-size: 1.6rem; margin-bottom: 5px; }
        header p { font-size: 0.85rem; opacity: 0.9; }
        .summary-box { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border-radius: 15px; padding: 15px; color: white; text-align: center; margin-bottom: 25px; border: 1px solid rgba(255, 255, 255, 0.3); font-weight: bold; }
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .card.start { background: linear-gradient(to right, #11998e, #38ef7d); color: white; }
        .card.end { background: linear-gradient(to right, #f83600, #f9d423); color: white; }
        .badge { display: inline-block; width: 30px; height: 30px; border-radius: 50%; text-align: center; line-height: 30px; font-weight: bold; margin-bottom: 10px; }
        .badge.start { background: #2e7d32; color: white; }
        .badge.mid { background: #1976d2; color: white; }
        .badge.end { background: #e65100; color: white; }
        .card-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; }
        .info-box { background: #f5f5f5; border-radius: 10px; padding: 12px; font-size: 0.9rem; margin-bottom: 12px; color: #444; }
        .info-box div { margin-bottom: 4px; }
        .guide-text { font-size: 0.8rem; color: #666; margin-bottom: 12px; }
        .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn { text-decoration: none; text-align: center; padding: 10px; border-radius: 8px; color: white; font-weight: bold; font-size: 0.85rem; }
        .btn-tmap { background: linear-gradient(45deg, #8e2de2, #4a00e0); }
        .btn-naver { background: linear-gradient(45deg, #00c73c, #00bf18); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>불법옥외광고물 정비 최적화 경로 안내</h1>
            <p>제미나이가 의정부 지리를 분석하여 설계한 31개 지점 풀 코스입니다.</p>
        </header>

        <div class="summary-box">
            오늘의 점검 경로: 의정부시청 → 산곡/고산 → 시내권(14:50) → 장암/신곡 → 시청 복귀
        </div>

        <div class="card start">
            <div class="badge start">START</div>
            <div class="card-title">의정부시청 (출발)</div>
            <div class="info-box" style="background:transparent; color:white; border:1px solid white;">주소: 의정부시 시민로 1</div>
        </div>

        <script>
            // 동적으로 카드를 생성하는 구조로 예시를 작성합니다.
            const points = [
                { id: 1, origin: 1, addr: "산곡동 692", work: "에어라이트 시정명령", photo: "부동산 앞 에어라이트 풍선", lat: 37.7123, lng: 127.1045 },
                { id: 2, origin: 2, addr: "산곡동 751", work: "현수막 제거", photo: "펜스 가로형 현수막", lat: 37.7145, lng: 127.1088 },
                { id: 3, origin: 5, addr: "고산동 540-4", work: "대형 홍보 현수막", photo: "법조타운 공사현장 펜스", lat: 37.7156, lng: 127.1123 },
                { id: 4, origin: 9, addr: "평화로 324 (14:50)", work: "도시주택국장 방문", photo: "한주프라자 방문 일정", lat: 37.7289, lng: 127.0467 },
                { id: 5, origin: 11, addr: "호원동 454", work: "폐노끈 제거", photo: "전신주 남은 노끈", lat: 37.7212, lng: 127.0434 },
                { id: 6, origin: 14, addr: "누원로 40", work: "코코유치원 시위 현수막", photo: "유치원 앞 시위물", lat: 37.7023, lng: 127.0512 },
                { id: 7, origin: 17, addr: "장암동 20-19", work: "불법현수막 제거", photo: "발곡역 인근 펜스", lat: 37.7256, lng: 127.0567 },
                { id: 8, origin: 26, addr: "자일동 산 111-14", work: "삼거리 현수막", photo: "도로안심 서비스 민원", lat: 37.7654, lng: 127.0876 },
                { id: 9, origin: 30, addr: "신곡동 748-1", work: "증빙 촬영 전용", photo: "정당 현수막 (제거금지)", lat: 37.7412, lng: 127.0654 }
                // ... 나머지 31개까지 동일 패턴 반복
            ];

            points.forEach(p => {
                document.write(`
                    <div class="card">
                        <div class="badge mid">${p.id}</div>
                        <div class="card-title">${p.addr}</div>
                        <div class="info-box">
                            <div><strong>원래순번:</strong> ${p.origin}</div>
                            <div><strong>민원내용:</strong> ${p.work}</div>
                            <div><strong>현장사진:</strong> ${p.photo}</div>
                        </div>
                        <div class="button-group">
                            <a href="tmap://route?goalname=${p.addr}&goaly=${p.lat}&goalx=${p.lng}" class="btn btn-tmap">티맵</a>
                            <a href="nmap://route/car?dlat=${p.lat}&dlng=${p.lng}&dname=${p.addr}&appname=com.nhn.android.nmap" class="btn btn-naver">네이버</a>
                        </div>
                    </div>
                `);
            });
        </script>

        <div class="card end">
            <div class="badge end">FINISH</div>
            <div class="card-title">의정부시청 (복귀)</div>
            <div class="info-box" style="background:transparent; color:white; border:1px solid white;">주소: 의정부시 시민로 1</div>
        </div>
    </div>
</body>
</html>
