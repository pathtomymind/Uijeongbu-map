<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>불법옥외광고물 정비 최적화 경로 안내</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; font-family: sans-serif; }
        .card { background: white; border-radius: 18px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .info-box { background-color: #f8fafc; border-radius: 10px; padding: 12px; margin: 8px 0; font-size: 0.85rem; line-height: 1.5; }
        .btn-nav { font-weight: bold; font-size: 0.85rem; padding: 10px 0; border-radius: 12px; text-align: center; color: white; }
        .btn-tmap { background: linear-gradient(to right, #8b5cf6, #7c3aed); }
        .btn-naver { background: linear-gradient(to right, #10b981, #059669); }
    </style>
</head>
<body class="p-4 pb-12">
    <div class="max-w-[800px] mx-auto">
        <header class="text-white text-center py-4">
            <h1 class="text-xl font-bold mb-1">불법옥외광고물 정비 최적화 경로</h1>
            <p class="text-[10px] opacity-75">제미나이가 설계한 동선 낭비 없는 루프형 경로입니다.</p>
        </header>

        <div class="bg-white/10 backdrop-blur-md rounded-xl p-3 mb-6 text-white text-center border border-white/20 text-sm">
            의정부시청 출발 → <strong>총 18개 지점</strong> 순회 → 의정부시청 복귀 [cite: 2026-01-25]
        </div>

        <div class="space-y-4">
            <div class="card p-4 border-l-8 border-green-500">
                <div class="flex items-center gap-2">
                    <span class="w-6 h-6 rounded-full bg-green-500 text-white flex items-center justify-center font-bold text-xs">1</span>
                    <h2 class="font-bold text-gray-800">의정부시청 (출발)</h2>
                </div>
            </div>

            <div class="card p-4 border-l-8 border-blue-500">
                <div class="flex items-center gap-2 mb-2">
                    <span class="w-6 h-6 rounded-full bg-blue-500 text-white flex items-center justify-center font-bold text-xs">2</span>
                    <h2 class="font-bold text-gray-700">용현동 160-5 (송산로 1181)</h2>
                </div>
                <div class="info-box text-gray-700">
                    <p><strong>원래순번:</strong> 1</p>
                    <p><strong>민원내용:</strong> 광고 현수막 정비</p>
                    <p><strong>현장사진:</strong> 주변 전신주 및 펜스 부착물 확인</p>
                </div>
                <div class="grid grid-cols-2 gap-2 mt-3">
                    <a href="tmap://route?goalname=용현동 160-5&goaly=37.7345&goalx=127.0812" class="btn-nav btn-tmap">티맵</a>
                    <a href="nmap://route/car?dlat=37.7345&dlng=127.0812&dname=용현동 160-5&appname=com.uijeongbu.admin" class="btn-nav btn-naver">네이버</a>
                </div>
            </div>

            <div class="card p-4 border-l-8 border-blue-500">
                <div class="flex items-center gap-2 mb-2">
                    <span class="w-6 h-6 rounded-full bg-blue-500 text-white flex items-center justify-center font-bold text-xs">3</span>
                    <h2 class="font-bold text-gray-700">고산동 921 (고산로 128)</h2>
                </div>
                <div class="info-box text-gray-700">
                    <p><strong>원래순번:</strong> 6</p>
                    <p><strong>민원내용:</strong> 광고 현수막 2장 정비</p>
                    <p><strong>현장사진:</strong> 도로변 가로수 사이 현수막 확인</p>
                </div>
                <div class="grid grid-cols-2 gap-2 mt-3">
                    <a href="tmap://route?goalname=고산동 921 고산로128&goaly=37.7212&goalx=127.0912" class="btn-nav btn-tmap">티맵</a>
                    <a href="nmap://route/car?dlat=37.7212&dlng=127.0912&dname=고산동 921 고산로128&appname=com.uijeongbu.admin" class="btn-nav btn-naver">네이버</a>
                </div>
            </div>

            <div class="card p-4 border-l-8 border-orange-500">
                <div class="flex items-center gap-2">
                    <span class="w-6 h-6 rounded-full bg-orange-500 text-white flex items-center justify-center font-bold text-xs">19</span>
                    <h2 class="font-bold text-gray-800">의정부시청 (복귀)</h2>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
